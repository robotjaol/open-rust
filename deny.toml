[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unlicense", "0BSD", "BSL-1.0", "MPL-2.0",
  "OFL-1.1", "Ubuntu-font-1.0", "CC0-1.0", "LGPL-2.1-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
